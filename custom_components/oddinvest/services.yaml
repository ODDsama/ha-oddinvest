refresh:
  name: Оновити дані
  description: >-
    Оновити довідник паперів НБУ і курс валют на боці сервіса oddinvestd,
    зробити знімок і републікувати стан у MQTT.
  fields:
    config_entry_id:
      # Який портфель. Порожньо — єдиний запис; із кількома записами без
      # нього сервіс відмовляє, а не розсилає дію всім.
      required: false
      selector:
        config_entry:
          integration: oddinvest

mark_payment:
  name: Позначити виплату
  description: >-
    Позначити виплату отриманою — тобто покласти гроші на рахунок, не
    чекаючи опівночі, — або зняти позначку.
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: oddinvest
    isin:
      name: ISIN
      description: Код паперу.
      required: true
      example: UA4000227748
      selector:
        text:
    pay_date:
      name: Дата виплати
      required: true
      selector:
        date:
    status:
      # «reinvested» звідси прибрано: сервіс скасував цей статус міграцією
      # 0017 і від того часу відповідає на нього помилкою. Купон на 82 ₴
      # не купує нічого, тож у покупку він потрапляє змішаним із власними
      # внесками, і питати, який саме купон оплатив конкретний папір, —
      # те саме, що питати, яка саме крапля води в склянці з крана.
      # Простій тепер рахується сам (uninvested_uah).
      name: Статус
      description: received — гроші надійшли; none — зняти позначку.
      required: true
      selector:
        select:
          options:
            - received
            - none
