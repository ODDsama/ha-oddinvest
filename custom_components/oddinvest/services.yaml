# Назви й описи сервісів і полів — у translations/*.json: вони там
# перекладені й мають перевагу над цим файлом, тож копія тут лише
# розходилась би з ними.
refresh:
  fields:
    config_entry_id:
      # Який портфель. Порожньо — єдиний запис; із кількома записами без
      # нього сервіс відмовляє, а не розсилає дію всім.
      required: false
      selector:
        config_entry:
          integration: oddinvest

mark_payment:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: oddinvest
    isin:
      required: true
      example: UA4000227748
      selector:
        text:
    pay_date:
      required: true
      selector:
        date:
    status:
      # «reinvested» звідси прибрано: сервіс скасував цей статус міграцією
      # 0017 і від того часу відповідає на нього помилкою. Купон на 82 ₴
      # не купує нічого, тож у покупку він потрапляє змішаним із власними
      # внесками, і питати, який саме купон оплатив конкретний папір, —
      # те саме, що питати, яка саме крапля води в склянці з крана.
      # Простій тепер рахується сам (uninvested_uah).
      required: true
      selector:
        select:
          options:
            - received
            - none
