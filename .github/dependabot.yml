# Оновлення залежностей.
#
# Сама інтеграція залежностей не має (requirements: [] у manifest.json) —
# усе потрібне дає Home Assistant. Але CI ставить pytest, jsonschema і ruff
# закріпленими версіями, і без нагляду вони застигнуть назавжди.
#
# github-actions тут особливо доречний: усі екшени закріплені за SHA
# коміту (hacs/action і hassfest тегів не мають — лише гілки, тож доти вони
# змінювались під ногами без жодного сліду в історії). Закріплене саме не
# оновлюється, тому стежить за ним dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }

  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
