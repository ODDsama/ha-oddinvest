name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "10 4 * * 1"  # щотижня: ловимо дрейф контракту і нових версій HA

jobs:
  contract:
    name: contract-тести проти фікстур oddinvest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # Рішення №5 концепції: фікстури живуть у репозиторії сервіса,
      # CI інтеграції завжди тестується проти його main-гілки.
      #
      # Спершу ЗВІРКА, а тоді вже стягування. Доти CI просто перезаписував
      # локальні копії, тож їхня застарілість була невидима: тести на
      # машині розробника бігали проти вчорашньої схеми й проходили, а
      # розбіжність доростала до тисяч байтів і не спливала ніде.
      - name: Локальні фікстури не застаріли
        run: sh scripts/sync-contract.sh --check
      - name: Стягнути актуальний контракт
        run: sh scripts/sync-contract.sh
      # Версії закріплені: плаваючі перетворюють щотижневий cron на джерело
      # червоного з причин, не пов'язаних із контрактом, а на таке швидко
      # вчишся не дивитись.
      - run: pip install pytest==8.3.4 jsonschema==4.23.0
      - run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # ruff уже налаштований у pyproject.toml — його просто ніхто не кликав.
      - run: pip install ruff==0.8.6
      - run: ruff check .
      - run: ruff format --check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master 2026-09

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-09
        with: { category: integration, ignore: brands }
